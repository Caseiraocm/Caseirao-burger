<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caseirão Burger - Pedido Online</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #ff7043;
            color: #333;
            padding: 20px;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            max-width: 400px;
            margin: auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        h1 { font-size: 22px; margin-bottom: 10px; }
        .item { display: flex; justify-content: space-between; margin: 10px 0; }
        input { width: 50px; text-align: center; }
        button {
            width: 100%;
            padding: 10px;
            background: #ff5722;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background: #e64a19; }
        .total { font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Faça seu Pedido</h1>

        <div class="item">
            <span>Sujinho - R$ 13</span>
            <input type="number" id="sujinho" value="0" min="0" data-price="13">
        </div>

        <div class="item">
            <span>Pé pra Fora - R$ 15</span>
            <input type="number" id="pePraFora" value="0" min="0" data-price="15">
        </div>

        <div class="item">
            <span>Refrigerante Lata - R$ 5</span>
            <input type="number" id="refrigeranteLata" value="0" min="0" data-price="5">
        </div>

        <div class="total">Total: R$ <span id="valorTotal">0</span></div>

        <button onclick="finalizarPedido()">Fazer Pedido</button>
    </div>

    <script>
        function atualizarTotal() {
            let total = 0;
            document.querySelectorAll("input").forEach(input => {
                total += input.value * input.dataset.price;
            });
            document.getElementById("valorTotal").innerText = total;
        }

        document.querySelectorAll("input").forEach(input => {
            input.addEventListener("input", atualizarTotal);
        });

        function finalizarPedido() {
            alert("Pedido realizado com sucesso!");
        }
    </script>
</body>
</html>
